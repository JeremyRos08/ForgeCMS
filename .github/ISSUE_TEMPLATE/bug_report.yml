name: Bug
description: Signaler un comportement incorrect ou une régression
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de fournir assez d'informations pour reproduire le problème.
  - type: textarea
    id: description
    attributes:
      label: Description du bug
      description: Que se passe-t-il ?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Étapes de reproduction
      placeholder: |
        1. Lancer...
        2. Ouvrir...
        3. Cliquer...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Version ou commit
      description: SHA du commit ou branche utilisée si connue.
  - type: input
    id: environment
    attributes:
      label: Environnement
      placeholder: "Windows 11, Python 3.12, Django 5.x"
  - type: textarea
    id: logs
    attributes:
      label: Logs utiles
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Vérifications
      options:
        - label: J'ai vérifié qu'une issue identique n'existe pas déjà.
          required: true
        - label: Je n'ai pas inclus de secret ou de donnée sensible.
          required: true
